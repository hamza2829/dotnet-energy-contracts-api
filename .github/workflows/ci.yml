name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore
      - name: Build with warnings as errors
        run: dotnet build --configuration Release --no-restore --warnaserror
      - name: Test invoice logic and services
        run: dotnet test tests/EnergyContracts.UnitTests --configuration Release --no-build --no-restore --logger "trx;LogFileName=results.trx" --results-directory TestResults/Unit
      - name: Test API with SQLite
        run: dotnet test tests/EnergyContracts.IntegrationTests --configuration Release --no-build --no-restore --logger "trx;LogFileName=results.trx" --results-directory TestResults/Integration
      - name: Test result summary
        if: always()
        shell: pwsh
        run: ./.github/scripts/summarize-tests.ps1
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 14
